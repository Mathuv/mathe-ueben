// Hints for the duration from a to b, in steps: to the next full hour, then whole hours, then the rest.
// big is 3600 (hours and minutes) or 60 (minutes and seconds).
function durationHints(a, b, big) {
  const withSec = big === 60, T = x => fmtTime(x, withSec);
  const up = Math.ceil(a / big) * big, down = Math.floor(b / big) * big;
  const pieces = up > down ? [[a, b]] : [[a, up], [up, down], [down, b]].filter(([x, y]) => y > x);
  const hints = [withSec
    ? t("Rechne in Schritten: zuerst bis zur nächsten vollen Minute, dann ganze Minuten, dann den Rest.", "Calculate in steps: first to the next full minute, then whole minutes, then the rest.")
    : t("Rechne in Schritten: zuerst bis zur nächsten vollen Stunde, dann ganze Stunden, dann den Rest.", "Calculate in steps: first to the next full hour, then whole hours, then the rest.")];
  const steps = pieces.map(([x, y]) => `${T(x)} → ${T(y)}: ${durText(y - x)}`).join(". ");
  hints.push(t(steps, steps));
  if (pieces.length > 1) {
    const sum = `${pieces.map(([x, y]) => durText(y - x)).join(" + ")} = ${durText(b - a)}`;
    hints.push(t(sum, sum));
  }
  return hints;
}

// Hints to add (sign 1) or subtract (sign -1) the duration d: first the whole hours or minutes, then the rest over the full hour or minute.
function calcHints(given, d, sign, withSec) {
  const big = withSec ? 60 : 3600, T = x => fmtTime(x, withSec), op = sign > 0 ? "+" : "−";
  const step = (x, amount, y) => `${T(x)} ${op} ${durText(amount)} = ${T(y)}`;
  const hints = [withSec
    ? t("Rechne zuerst die ganzen Minuten, dann die Sekunden. 1 min = 60 s.", "First calculate the whole minutes, then the seconds. 1 min = 60 s.")
    : t("Rechne zuerst die ganzen Stunden, dann die Minuten. 1 h = 60 min.", "First calculate the whole hours, then the minutes. 1 h = 60 min.")];
  const whole = Math.floor(d / big) * big, rest = d - whole;
  let x = given;
  if (whole) {
    const s = step(x, whole, x + sign * whole);
    hints.push(t(s, s));
    x += sign * whole;
  }
  if (rest) {
    const edge = sign > 0 ? Math.floor(x / big) * big + big : Math.floor(x / big) * big;
    const crosses = sign > 0 ? x + rest > edge : x - rest < edge && x > edge;
    const s = crosses
      ? `${step(x, Math.abs(edge - x), edge)}. ${step(edge, rest - Math.abs(edge - x), x + sign * rest)}`
      : step(x, rest, x + sign * rest);
    hints.push(t(s, s));
  }
  return hints;
}

const WEEKDAYS = [t("Montag", "Monday"), t("Dienstag", "Tuesday"), t("Mittwoch", "Wednesday"), t("Donnerstag", "Thursday"),
  t("Freitag", "Friday"), t("Samstag", "Saturday"), t("Sonntag", "Sunday")];
const MONTHS = [t("März", "March"), t("Mai", "May"), t("Juli", "July"), t("Oktober", "October")];

function genDuration() {
  const kind = pick(["hm", "hm", "ms", "days"]);
  if (kind === "days") {
    const day = rnd(0, 6), a = rnd(0, 23) * 3600, d = rnd(25, 80) * 3600, b = a + d;
    const days = Math.floor(d / DAY), hours = (d % DAY) / 3600;
    const end = (day + Math.floor(b / DAY)) % 7, mid = (day + days) % 7, ta = fmtTime(a), tb = fmtTime(b % DAY);
    const wd = (i, lang) => WEEKDAYS[i][lang];
    const hints = [t("1 Tag (1 d) hat 24 Stunden (24 h).", "1 day (1 d) has 24 hours (24 h)."),
      t(`Von ${wd(day, "de")} ${ta} bis ${wd(mid, "de")} ${ta} ${days === 1 ? "ist es 1 Tag" : `sind es ${days} Tage`}.`,
        `From ${wd(day, "en")} ${ta} to ${wd(mid, "en")} ${ta} it is ${days === 1 ? "1 day" : `${days} days`}.`)];
    if (hours) {
      hints.push(t(`Von ${wd(mid, "de")} ${ta} bis ${wd(end, "de")} ${tb} sind es noch ${hours}${NBSP}h.`, `From ${wd(mid, "en")} ${ta} to ${wd(end, "en")} ${tb} it is ${hours}${NBSP}h more.`));
    }
    return {
      type: "number",
      level: 5,
      prompt: t("Wie lange dauert es? Schreibe die Zeitdauer in Tagen und Stunden.", "How long is it? Write the duration in days and hours."),
      visual: t(`<div class="bigtext">${wd(day, "de")} ${ta} → ${wd(end, "de")} ${tb}</div>`, `<div class="bigtext">${wd(day, "en")} ${ta} → ${wd(end, "en")} ${tb}</div>`),
      fields: [{ label: null, unit: "d", answer: days }, { label: null, unit: "h", answer: hours }],
      hints,
      solution: t(`Es dauert <b>${durText(d)}</b>, also ${d / 3600}${NBSP}h.`, `It takes <b>${durText(d)}</b>, that is ${d / 3600}${NBSP}h.`),
    };
  }
  const withSec = kind === "ms";
  const a = withSec ? rnd(7 * 3600, 21 * 3600) : rnd(6 * 60, 20 * 60) * 60;
  const d = withSec ? rnd(20, 900) : rnd(5, 240) * 60, b = a + d;
  if (b >= DAY) return null;
  const big = withSec ? 60 : 3600;
  return {
    type: "number",
    level: withSec ? 4 : 3,
    prompt: t("Wie lange dauert es von der ersten Uhrzeit bis zur zweiten?", "How long is it from the first time to the second?"),
    visual: `<div class="bigtext">${fmtTime(a, withSec)} → ${fmtTime(b, withSec)}</div>`,
    fields: withSec
      ? [{ label: null, unit: "min", answer: Math.floor(d / 60) }, { label: null, unit: "s", answer: d % 60 }]
      : [{ label: null, unit: "h", answer: Math.floor(d / 3600) }, { label: null, unit: "min", answer: (d % 3600) / 60 }],
    hints: durationHints(a, b, big),
    solution: t(`Es dauert <b>${durText(d)}</b>.`, `It takes <b>${durText(d)}</b>.`),
  };
}

function genTimeCalc() {
  const kind = pick(["end", "end", "start", "start", "endSec", "startSec", "date"]);
  if (kind === "date") {
    // The date stays inside one month.
    const mo = pick(MONTHS), day = rnd(1, 20), a = rnd(6, 21) * 3600, days = rnd(1, 3), hours = rnd(1, 20);
    const d = days * DAY + hours * 3600, endDay = day + Math.floor((a + d) / DAY), endTime = (a + d) % DAY;
    const later = a + hours * 3600;
    const daysWords = plural(days, "Tag", "Tagen", "day", "days"), hoursWords = plural(hours, "Stunde", "Stunden", "hour", "hours");
    const hints = [t(`Gehe auf dem Kalender vorwärts: ${day}. ${mo.de} + ${plural(days, "Tag", "Tage", "day", "days").de} = ${day + days}. ${mo.de}. Die Uhrzeit bleibt ${fmtTime(a)}.`,
      `Move forward on the calendar: ${day} ${mo.en} + ${plural(days, "day", "days", "day", "days").en} = ${day + days} ${mo.en}. The time is still ${fmtTime(a)}.`)];
    hints.push(later < DAY
      ? t(`Zähle jetzt die Stunden dazu: ${fmtTime(a)} + ${hours}${NBSP}h = ${fmtTime(later)}.`, `Now add the hours: ${fmtTime(a)} + ${hours}${NBSP}h = ${fmtTime(later)}.`)
      : t(`Wenn du ${hours}${NBSP}h dazuzählst, erreichst du den nächsten Tag: ${endDay}. ${mo.de}, ${fmtTime(later - DAY)} Uhr.`,
        `Add ${hours}${NBSP}h to reach the next day: ${endDay} ${mo.en} at ${fmtTime(later - DAY)}.`));
    return {
      type: "number",
      level: 4,
      prompt: t(`Am ${day}. ${mo.de} um ${fmtTime(a)} Uhr stellt ein Kind beim Töpferkurs eine Tonfigur zum Trocknen hin. Nach ${daysWords.de} und ${hoursWords.de} ist sie trocken. An welchem Tag und um welche Uhrzeit ist das?`,
        `On ${day} ${mo.en} at ${fmtTime(a)}, a child sets a clay figure out to dry in pottery class. It will be dry in ${daysWords.en} and ${hoursWords.en}. On what day and at what time will it be dry?`),
      visual: t(`<div class="bigtext">${day}. ${mo.de} ${fmtTime(a)} + ${durText(d)} = ${SLOT}</div>`, `<div class="bigtext">${day} ${mo.en} ${fmtTime(a)} + ${durText(d)} = ${SLOT}</div>`),
      fields: [{ label: t(`Tag im ${mo.de}`, `day in ${mo.en}`), answer: endDay }, { label: t("Uhrzeit", "time"), time: "hm", answer: endTime }],
      hints,
      solution: t(`Die Tonfigur ist am <b>${endDay}. ${mo.de} um ${fmtTime(endTime)}</b> trocken.`, `The clay figure is dry on <b>${endDay} ${mo.en} at ${fmtTime(endTime)}</b>.`),
    };
  }
  const withSec = kind.endsWith("Sec"), toEnd = kind.startsWith("end");
  const d = withSec ? rnd(20, 600) : rnd(5, 180) * 60;
  const a = withSec ? rnd(7 * 3600, 21 * 3600) : rnd(6 * 60, 20 * 60) * 60, b = a + d;
  if (b >= DAY) return null;
  const given = toEnd ? a : b, answer = toEnd ? b : a, op = toEnd ? "+" : "−";
  const expr = `${fmtTime(given, withSec)} ${op} ${durText(d)}`;
  return {
    type: "number",
    level: withSec ? 4 : 3,
    prompt: toEnd ? t("Wann ist das Ende? Rechne die Uhrzeit aus.", "When is the end? Calculate the time.") : t("Wann war der Anfang? Rechne die Uhrzeit aus.", "When was the start? Calculate the time."),
    visual: `<div class="bigtext">${expr} = ${SLOT}</div>`,
    fields: [{ label: null, time: withSec ? "hms" : "hm", answer }],
    hints: calcHints(given, d, toEnd ? 1 : -1, withSec),
    solution: t(`${expr} = <b>${fmtTime(answer, withSec)}</b>`, `${expr} = <b>${fmtTime(answer, withSec)}</b>`),
  };
}

const ROUTES = [["Uster", "Wetzikon"], ["Meilen", "Rapperswil"], ["Cham", "Baar"], ["Sarnen", "Stans"], ["Wil", "Frauenfeld"], ["Knonau", "Rotkreuz"]];

function genTimeWord() {
  const kind = pick(["croissants", "birdhouse", "parcelDelivery", "bandDeparture", "cinema", "puzzles", "audioDuration", "boxTimer"]);
  const T = (x, withSec) => fmtTime(x, withSec);
  const timeAnswer = (level, prompt, answer, hints, withSec) => ({
    type: "number",
    level,
    prompt,
    fields: [{ label: null, time: withSec ? "hms" : "hm", answer }],
    hints,
    solution: t(`Die gesuchte Uhrzeit ist <b>${T(answer, withSec)}</b>.`, `The time you need is <b>${T(answer, withSec)}</b>.`),
  });
  if (kind === "croissants") {
    const a = rnd(7 * 60, 7 * 60 + 50) * 60, d = rnd(8, 25) * 60;
    return timeAnswer(3, t(`Um ${T(a)} Uhr stellt die Bäckerin die Gipfeli in den Ofen. Sie brauchen ${d / 60}${NBSP}min im Ofen. Wann sind sie fertig?`,
      `At ${T(a)} the baker puts the croissants in the oven. They need ${d / 60}${NBSP}min in the oven. When are they ready?`), a + d, calcHints(a, d, 1, false));
  }
  if (kind === "birdhouse") {
    const a = rnd(8 * 60, 14 * 60) * 60, d = rnd(40, 200) * 60, b = a + d;
    return {
      type: "number",
      level: 4,
      prompt: t(`Eine Familie baut ein Vogelhaus. Um ${T(a)} Uhr fängt sie an. Um ${T(b)} Uhr ist das Haus fertig. Wie lange arbeitet die Familie daran?`,
        `A family makes a birdhouse. They start at ${T(a)} and finish at ${T(b)}. How long do they work on it?`),
      fields: [{ label: null, unit: "h", answer: Math.floor(d / 3600) }, { label: null, unit: "min", answer: (d % 3600) / 60 }],
      hints: durationHints(a, b, 3600),
      solution: t(`Die Familie arbeitet <b>${durText(d)}</b> am Vogelhaus.`, `The family works on the birdhouse for <b>${durText(d)}</b>.`),
    };
  }
  if (kind === "parcelDelivery" || kind === "bandDeparture") {
    const [from, to] = pick(ROUTES), a = rnd(6 * 60, 20 * 60) * 60, d = rnd(30, 150) * 60, b = a + d;
    if (kind === "parcelDelivery") {
      return timeAnswer(4, t(`Ein Lieferwagen startet in ${from} um ${T(a)} Uhr. Mit allen Stopps dauert die Fahrt ${durText(d)}. Um welche Uhrzeit liefert der Fahrer das letzte Paket in ${to} ab?`,
        `A delivery van sets off from ${from} at ${T(a)}. The trip takes ${durText(d)} with all the stops. At what time does the driver deliver the last parcel in ${to}?`), b, calcHints(a, d, 1, false));
    }
    return timeAnswer(4, t(`Der Musikverein spielt um ${T(b)} Uhr in ${to}. Die Gruppe braucht mit dem Bus ab ${from} genau ${durText(d)} bis zum Auftritt. Um welche Uhrzeit muss sie in ${from} losfahren?`,
      `A band plays in ${to} at ${T(b)}. It takes exactly ${durText(d)} from its bus departure in ${from} to the start of the show. At what time must the band leave ${from}?`), a, calcHints(b, d, -1, false));
  }
  if (kind === "cinema") {
    const now = rnd(13 * 60, 18 * 60) * 60, wait = rnd(2, 25), late = pick([0, 0, 3, 5, 10]), dep = now + wait * 60;
    const city = pick(["Uster", "Wetzikon", "Meilen", "Rapperswil", "Sarnen", "Stans"]);
    const hints = [t(`Lies die Uhr ab und zähle 12 Stunden dazu: Aus ${T(now - 12 * 3600)} wird ${T(now)}.`, `Read the clock and add 12 hours: ${T(now - 12 * 3600)} becomes ${T(now)}.`),
      t(`Bis zum geplanten Beginn vergehen ab ${T(now)} noch ${wait}${NBSP}min.`, `From ${T(now)} there are ${wait}${NBSP}min until the scheduled start.`)];
    if (late) hints.push(t(`Zähle die zusätzlichen Minuten dazu: ${wait}${NBSP}min + ${late}${NBSP}min = ${wait + late}${NBSP}min.`, `Add the extra minutes: ${wait}${NBSP}min + ${late}${NBSP}min = ${wait + late}${NBSP}min.`));
    return {
      type: "number",
      level: 4,
      prompt: t(`Am Nachmittag wartet eine Familie in ${city} vor dem Kino. Die Uhr zeigt, wie spät es jetzt ist. Auf dem Plakat steht als Filmbeginn ${T(dep)} Uhr. ${late ? `Der Film beginnt ${late} Minuten später als geplant. ` : ""}Wie viele Minuten muss die Familie noch warten?`,
        `In the afternoon, a family waits outside the cinema in ${city}. The clock shows the time now. The poster says the film starts at ${T(dep)}. ${late ? `The film starts ${late} minutes later than planned. ` : ""}How many more minutes must the family wait?`),
      visual: clockSvg(now, false, "none"),
      fields: [{ label: null, unit: "min", answer: wait + late }],
      hints,
      solution: t(`Bis zum Filmbeginn sind es noch <b>${wait + late}${NBSP}min</b>.`, `There are <b>${wait + late}${NBSP}min</b> left until the film starts.`),
    };
  }
  if (kind === "puzzles") {
    const a1 = rnd(9 * 60, 15 * 60) * 60, d1 = rnd(40, 90) * 60, a2 = a1 + rnd(5, 40) * 60;
    const d2 = Math.random() < 0.2 ? d1 : d1 + pick([-1, 1]) * rnd(2, 15) * 60;
    const answer = d1 > d2 ? "1" : d2 > d1 ? "2" : "=";
    const result = {
      1: t("Das <b>rote Team</b> braucht länger.", "The <b>red team</b> takes longer."),
      2: t("Das <b>blaue Team</b> braucht länger.", "The <b>blue team</b> takes longer."),
      "=": t("Beide Teams brauchen <b>gleich lang</b>.", "Both teams take <b>the same time</b>."),
    }[answer];
    return {
      type: "choice",
      level: 5,
      prompt: t(`An einem Spieltag lösen zwei Teams je ein Riesenpuzzle. Das rote Team puzzelt von ${T(a1)} bis ${T(a1 + d1)} Uhr. Das blaue Team puzzelt von ${T(a2)} bis ${T(a2 + d2)} Uhr. Wer braucht länger?`,
        `At a games event, each team solves a giant jigsaw puzzle. The red team works from ${T(a1)} to ${T(a1 + d1)}. The blue team works from ${T(a2)} to ${T(a2 + d2)}. Who takes longer?`),
      options: [{ label: t("rotes Team", "red team"), value: "1" }, { label: t("blaues Team", "blue team"), value: "2" }, { label: t("beide gleich lang", "both the same"), value: "=" }],
      answer,
      hints: [t("Ziehe für jedes Team die Startzeit von der Endzeit ab.", "For each team, subtract the start time from the end time."),
        t(`Das rote Team braucht ${durText(d1)}: von ${T(a1)} bis ${T(a1 + d1)}.`, `The red team takes ${durText(d1)}: from ${T(a1)} to ${T(a1 + d1)}.`),
        t(`Das blaue Team braucht ${durText(d2)}: von ${T(a2)} bis ${T(a2 + d2)}.`, `The blue team takes ${durText(d2)}: from ${T(a2)} to ${T(a2 + d2)}.`)],
      solution: t(`Rot: ${durText(d1)}. Blau: ${durText(d2)}. ${result.de}`, `Red: ${durText(d1)}. Blue: ${durText(d2)}. ${result.en}`),
    };
  }
  if (kind === "boxTimer") {
    // The time estimate can be correct or incorrect.
    const mo = pick(MONTHS), day = rnd(1, 20), k = rnd(1, 2);
    const a = rnd(8 * 60, 21 * 60) * 60, b = rnd(8 * 60, 20 * 60) * 60;
    const real = DAY - a + (k - 1) * DAY + b;
    const right = Math.random() < 0.4;
    const said = right ? real : real + pick([-4, -2, -1, 1, 2, 4]) * 3600;
    const hints = [t(`Rechne den Rest des ersten Tages aus: ab ${T(a)} bis Mitternacht sind es ${durText(DAY - a)}.`, `Find the time left on the first day: from ${T(a)} to midnight is ${durText(DAY - a)}.`)];
    if (k === 2) hints.push(t(`Dazwischen liegt ein voller Tag mit 24${NBSP}h.`, `There is a full day of 24${NBSP}h in between.`));
    hints.push(t(`Rechne am ${day + k}. ${mo.de} die Zeit seit Mitternacht dazu: bis ${T(b)} sind es ${durText(b)}.`, `Add the time since midnight on ${day + k} ${mo.en}: until ${T(b)} it is ${durText(b)}.`));
    hints.push(t(`Die Wartezeit beträgt insgesamt ${hoursText(real)}.`, `The total wait is ${hoursText(real)}.`));
    return {
      type: "choice",
      level: 5,
      prompt: t(`Eine Bücherkiste bleibt bis zum ${day + k}. ${mo.de} um ${T(b)} Uhr verschlossen. Am ${day}. ${mo.de} um ${T(a)} Uhr zeigt der Timer noch ${hoursText(said)} an. Zeigt er die richtige Wartezeit an?`,
        `A box of books stays locked until ${day + k} ${mo.en} at ${T(b)}. On ${day} ${mo.en} at ${T(a)}, the timer shows ${hoursText(said)} left. Does it show the correct wait?`),
      options: [{ label: t("Ja, der Timer stimmt.", "Yes, the timer is correct."), value: "yes" }, { label: t("Nein, der Timer stimmt nicht.", "No, the timer is wrong."), value: "no" }],
      answer: right ? "yes" : "no",
      hints,
      solution: right
        ? t(`<b>Ja.</b> Die Kiste öffnet sich in ${hoursText(real)}.`, `<b>Yes.</b> The box opens in ${hoursText(real)}.`)
        : t(`<b>Nein.</b> Die Kiste öffnet sich in ${hoursText(real)}, nicht in ${hoursText(said)}.`, `<b>No.</b> The box opens in ${hoursText(real)}, not ${hoursText(said)}.`),
    };
  }
  const start = rnd(8 * 60, 17 * 60) * 60, w = rnd(60, 600), end = start + w;
  if (Math.random() < 0.5) {
    return timeAnswer(4, t(`Ein Kinderchor beginnt seine Aufnahme um ${T(start, true)}. Die Aufnahme dauert ${durText(w)}. Um welche Uhrzeit endet die Aufnahme?`,
      `A children's choir starts its recording at ${T(start, true)}. The recording lasts ${durText(w)}. At what time does it end?`), end, calcHints(start, w, 1, true), true);
  }
  return {
    type: "number",
    level: 4,
    prompt: t(`Die Erzählerin im Radio beginnt um ${T(start, true)}. Ihr letztes Wort spricht sie um ${T(end, true)}. Wie lange dauert ihre Geschichte?`,
      `The storyteller on the radio starts at ${T(start, true)}. She says her last word at ${T(end, true)}. How long is her story?`),
    fields: [{ label: null, unit: "min", answer: Math.floor(w / 60) }, { label: null, unit: "s", answer: w % 60 }],
    hints: durationHints(start, end, 60),
    solution: t(`Die Geschichte dauert <b>${durText(w)}</b>.`, `The story lasts <b>${durText(w)}</b>.`),
  };
}

  { id: "lz", name: t("📏⏰ Längen & Zeit", "📏⏰ Lengths & time"), title: t("Mathe 4 – Längen & Zeit", "Maths 4 – Lengths & time"), sections: ["L", "Z"] },

];

function skillsOfBlock(id) {
  const sections = BLOCKS.find(b => b.id === id).sections;
  return SKILLS.filter(s => sections.includes(s.sec));
}

function generate(skillId) {
  const skill = SKILLS.find(s => s.id === skillId);
  for (let i = 0; i < 500; i++) {
    const q = skill.gen();
    if (q) { q.skill = skillId; return q; }
  }
  throw new Error("generator failed: " + skillId);
}

function isFilled(v) { return String(v ?? "").trim() !== ""; }

// A field with a unit can stay empty, because it counts as 0. One field must have an answer.
function isAnswered(q, input) {
  if (q.type === "number") return q.fields.every((f, i) => f.unit || isFilled(input[i])) && input.some(isFilled);
  if (q.type === "choice" || q.type === "line") return input !== null;
  if (q.type === "order") return input.length === q.items.length;
  if (q.type === "multi") return q.allowEmpty || input.length > 0;

const S = {

function L(x) {

}

function newQuestion(skillId) {
  S.skill = skillId;

function startSkill(id) { S.mix = null; S.view = "practice"; newQuestion(id); render(); }

}

  const ids = skillsOfBlock(S.block).map(s => s.id);
  let id;

  S.mix.last = id;
  return id;
}

function syncInputs() {
  if (S.q && S.q.type === "number" && !S.done) {
    S.input = S.q.fields.map((_, i) => { const el = document.getElementById("f" + i); return el ? el.value : ""; });
  }
}

function doCheck() {
  syncInputs();
  const q = S.q;
  if (!isAnswered(q, S.input)) { S.msg = "answerFirst"; render(); return; }
  const r = check(q, S.input);
  S.marks = r.fields || null;
  if (r.ok) {
    S.done = true;
    S.result = S.firstTry ? "first" : "later";
    S.okMsg = pick(UI.ok);
  } else {
    S.attempts++; S.firstTry = false;
    if (S.attempts >= 3) { S.done = true; S.result = "shown"; }
    else { S.hintsShown = Math.min(q.hints.length, S.hintsShown + 1); S.msg = "wrong"; }
  }
  if (S.done) {
    S.msg = null;
    if (S.timer) S.timer.used = (performance.now() - S.timer.start) / 1000;
    const before = S.progress[S.skill] || 0;
    S.progress[S.skill] = nextMastery(before, S.result);
    S.starNow = before < 5 && S.progress[S.skill] >= 5;
    save();
    if (S.mix) {
      if (S.result === "first") S.mix.correct++;
      else S.mix.missed[S.skill] = (S.mix.missed[S.skill] || 0) + 1;
      S.mix.log.push({ skill: S.skill, level: S.q.level, limit: S.timer.limit, used: S.timer.used, result: S.result });
    }
  }
  if (!r.ok) play(S.result === "shown" ? "fail" : "wrong");
  else if (S.starNow) play("star");
  else play("right");
  render();

}

function doNext() {
  if (S.mix) {
    if (S.mix.i >= S.mix.n) { S.view = "summary"; render(); return; }
    S.mix.i++;
    newQuestion(pickMixSkill());
  } else {
    newQuestion(S.skill);

  render();
}

  syncInputs();
  S.hintsShown = Math.min(S.q.hints.length, S.hintsShown + 1);
  // A hint after the answer does not change the points.
  if (!S.done) S.firstTry = false;
  play("hint");
  render();
}

// ---------- timer ----------
// A soft timer: when the time is up, the child can still finish the problem, and the points do not change.

function mmss(seconds) {
  const s = Math.round(seconds);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function timerHtml() {
  const tm = S.timer;
  const used = tm.used === null ? (performance.now() - tm.start) / 1000 : tm.used;
  const left = Math.max(0, tm.limit - used);
  const cls = tm.over ? "over" : left < tm.limit * 0.3 ? "low" : "";
  const word = S.lang === "en" ? UI.level.en : UI.level.de;
  const text = tm.over ? L(UI.timeUp) : `⏱️ ${mmss(left)} · ${word} ${S.q.level}`;
  return `<div id="timer" class="timer ${cls}"><div class="timer-track"><div class="timer-bar" style="width:${(100 * left / tm.limit).toFixed(1)}%"></div></div><span>${text}</span></div>`;
}

// Updates only the timer element, so the other parts of the page (and typed answers) stay as they are.
function tickTimer() {
  const tm = S.timer;
  if (!tm || !S.timerOn || S.view !== "practice" || tm.used !== null) return;
  if (!tm.over && (performance.now() - tm.start) / 1000 >= tm.limit) {
    tm.over = true;
    play("timeup");
  }
  const el = document.getElementById("timer");
  if (el) el.outerHTML = timerHtml();
}

function tone(freq, start, length, wave, volume = 0.25) {
  const osc = audioCtx.createOscillator();

  osc.stop(t0 + length + 0.05);

        fire({ particleCount: 40, angle: 60, spread: 55, startVelocity: 60, colors, origin: { x: 0, y: 0.9 } });
        fire({ particleCount: 40, angle: 120, spread: 55, startVelocity: 60, colors, origin: { x: 1, y: 0.9 } });
      });
    }
  },
  emojiRain(fire, emojis) {
    for (let i = 0; i < 14; i++) {
      later(i * 180, () => fire({ particleCount: 4, angle: 270, spread: 90, startVelocity: 5, gravity: 0.5, ticks: 400,
        scalar: EMOJI_SCALE, flat: true, shapes: emojis, origin: { x: Math.random(), y: -0.05 } }));
    }
  },
  emojiExplosion(fire, emojis) {
    fire({ particleCount: 40, spread: 360, startVelocity: 45, ticks: 160, scalar: EMOJI_SCALE, flat: true, shapes: emojis, origin: { x: 0.5, y: 0.45 } });
    later(600, () => fire({ particleCount: 25, spread: 360, startVelocity: 30, ticks: 160, scalar: EMOJI_SCALE, flat: true, shapes: emojis, origin: { x: 0.5, y: 0.45 } }));
  },
  starRings(fire, emojis, colors) {
    for (let i = 0; i < 3; i++) {
      later(i * 400, () => fire({ particleCount: 60, spread: 360, startVelocity: 20 + i * 12, gravity: 0.3, decay: 0.94, ticks: 120,
        scalar: 1.4, shapes: ["star"], colors, origin: { x: 0.5, y: 0.45 } }));
    }
  },
  rainbowSpiral(fire, emojis, colors) {
    for (let i = 0; i < 18; i++) {
      later(i * 110, () => fire({ particleCount: 14, angle: i * 40, spread: 20, startVelocity: 40,
        colors: [colors[i % colors.length]], origin: { x: 0.5, y: 0.45 } }));
    }
  },
  snowfall(fire, emojis, colors) {
    for (let i = 0; i < 40; i++) {
      later(i * 60, () => fire({ particleCount: 2, angle: 270, spread: 60, startVelocity: 2, gravity: 0.25, drift: Math.random() - 0.5,
        ticks: 500, scalar: 1.2, shapes: ["circle"], colors, origin: { x: Math.random(), y: -0.05 } }));
    }
  },
  fountain(fire, emojis, colors) {
    for (let i = 0; i < 12; i++) {
      if (i % 2 === 0) {
        later(i * 150, () => fire({ particleCount: 14, angle: 90, spread: 30, startVelocity: 65, gravity: 1.1, ticks: 150,
          colors, origin: { x: 0.5, y: 1 } }));
      } else {
        later(i * 150, () => fire({ particleCount: 5, angle: 90, spread: 30, startVelocity: 65, gravity: 1.1, ticks: 150,
          scalar: EMOJI_SCALE, flat: true, shapes: emojis, origin: { x: 0.5, y: 1 } }));
      }
    }
  },
};

// Takes the next item from a shuffled bag that the browser saves. A new bag never starts
// with the item that came last, so the same item never comes two times in a row.
function nextFromBag(key, items) {
  const saved = JSON.parse(storage.getItem(key) || "{}");
  let bag = (saved.bag || []).filter(x => items.includes(x));
  if (bag.length === 0) {
    bag = shuffle(items);
    if (bag[0] === saved.last) bag.push(bag.shift());
  }
  const item = bag.shift();
  storage.setItem(key, JSON.stringify({ bag, last: item }));
  return item;
}

const emojiShapes = {};
function themeEmojis(name) {
  if (!emojiShapes[name]) {
    emojiShapes[name] = PARTY_THEMES[name].emojis.map(text => confetti.shapeFromText({ text, scalar: EMOJI_SCALE }));
  }
  return emojiShapes[name];
}

function viewInput(q) {
  const dis = S.done ? "disabled" : "";
  if (q.type === "number") {
    return `<div class="fields">${q.fields.map((f, i) => {
      const cls = S.marks ? (S.marks[i] ? "right" : "wrong") : "";
      // A time field opens the number keyboard with a separator key. The key is "." or "," by the region of the phone.
      const kind = f.time
        ? `class="${cls} time" inputmode="decimal" placeholder="${f.time === "hms" ? "hh:mm:ss" : "hh:mm"}"`
        : `class="${cls}${f.unit ? " short" : ""}" inputmode="numeric"`;
      const input = `<input id="f${i}" ${kind} autocomplete="off" value="${S.input[i] || ""}" ${dis}>`;
      return `<label>${L(f.label)}${f.unit ? `<span class="inrow">${input}<span class="unit">${f.unit}</span></span>` : input}</label>`;
    }).join("")}</div>`;
  }
  if (q.type === "choice") {
    return `<div class="chips">${q.options.map(o => `<button class="chip ${S.input === o.value ? "sel" : ""}" data-choice="${o.value}" ${dis}>${L(o.label)}</button>`).join("")}</div>`;
  }
  if (q.type === "multi") {
    return `<div class="chips">${q.options.map((o, i) => `<button class="chip ${S.input.includes(i) ? "sel" : ""}" data-multi="${i}" ${dis}>${o}</button>`).join("")}</div>`;
  }
  if (q.type === "order") {
    const chosen = S.input.map((idx, k) => `${k ? `<span class="sym">${q.sym}</span>` : ""}<button class="chip sel" data-unpick="${k}" ${dis}>${fmt(q.items[idx])}</button>`).join("");
    const left = q.items.map((v, idx) => (S.input.includes(idx) ? "" : `<button class="chip" data-pick="${idx}" ${dis}>${fmt(v)}</button>`)).join("");
    return `<div class="chips">${left}</div><div class="orderrow">${chosen}</div>` +
      (S.done ? "" : `<button class="btn light" data-act="clearorder">${L(UI.reset)}</button>`);
  }
  if (q.type === "line") {
    const marks = [];
    if (S.input !== null && !(S.done && S.input === q.answer)) marks.push({ i: S.input, color: S.done ? "#c0392b" : "#1f5a96", label: S.done ? "✗" : "" });
    if (S.done) marks.push({ i: q.answer, color: "#1e8a4c", label: fmt(q.line.start + q.answer * q.line.unit) });
    return `<div class="visual">${numberLineSvg(q.line, { marks, clickable: !S.done })}</div>`;
  }
  return "";
}

function endGame() {
  if (S.gameClock.ended) return;
  S.gameClock.ended = true;
  play("timeup");
  render();
}

function gameAction(action) {
  if (S.view !== "game" || S.gameClock.ended) return;
  if (action === "gleft") gameMove(S.game, -1);
  else if (action === "gright") gameMove(S.game, 1);
  else if (action === "gturn") gameTurn(S.game);
  else if (action === "gdown") { if (gameDown(S.game) > 0) play("right"); }
  else if (action === "gdrop") { if (gameDrop(S.game) > 0) play("right"); }
  if (S.game.over) endGame();
}

function drawGame() {
  const canvas = document.getElementById("game-canvas");
  if (!canvas) return;
  const ratio = window.devicePixelRatio;
  const width = Math.round(canvas.clientWidth * ratio), height = Math.round(canvas.clientHeight * ratio);
  if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }
  const ctx = canvas.getContext("2d");
  const cell = canvas.width / GAME_COLS;
  const rowHeight = canvas.height / GAME_ROWS;
  ctx.fillStyle = "#e6f3f8";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "#ccdee6";
  ctx.lineWidth = ratio;
  for (let col = 1; col < GAME_COLS; col++) {
    ctx.beginPath(); ctx.moveTo(col * cell, 0); ctx.lineTo(col * cell, canvas.height); ctx.stroke();
  }
  for (let row = 1; row < GAME_ROWS; row++) {
    ctx.beginPath(); ctx.moveTo(0, row * rowHeight); ctx.lineTo(canvas.width, row * rowHeight); ctx.stroke();
  }
  const colors = { zweier: "#c95548", dreier: "#edc44e", ecke: "#79533e", wuerfel: "#cfaa78" };
  function block(row, col, id) {
    const x = col * cell + ratio * 2, y = row * rowHeight + ratio * 2;
    const w = cell - ratio * 4, h = rowHeight - ratio * 4;
    ctx.fillStyle = colors[id];
    ctx.strokeStyle = "#765336";
    ctx.beginPath(); ctx.roundRect(x, y, w, h, ratio * 4); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.beginPath(); ctx.moveTo(x + w * 0.15, y + h * 0.2); ctx.lineTo(x + w * 0.85, y + h * 0.2); ctx.stroke();
    if (id === "zweier") {
      ctx.fillStyle = "#fff";
      ctx.fillRect(x + w * 0.4, y + h * 0.25, w * 0.2, h * 0.5);
      ctx.fillRect(x + w * 0.25, y + h * 0.4, w * 0.5, h * 0.2);
    } else if (id === "dreier") {
      ctx.fillStyle = "#c79b29";
      ctx.beginPath(); ctx.arc(x + w * 0.3, y + h * 0.6, w * 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + w * 0.7, y + h * 0.35, w * 0.08, 0, Math.PI * 2); ctx.fill();
    }
  }
  for (let row = 0; row < GAME_ROWS; row++) {
    for (let col = 0; col < GAME_COLS; col++) {
      const id = S.game.board[row][col];
      if (id) block(row, col, id);
    }
  }
  if (!S.game.over) {
    for (const [row, col] of S.game.piece.cells) block(S.game.piece.row + row, S.game.piece.col + col, S.game.piece.id);
  }
}

function gameFrame(now) {
  if (S.view !== "game" || S.gameClock.ended) return;
  const clock = S.gameClock;
  const elapsed = clock.last === null ? 0 : Math.min(100, now - clock.last);
  clock.last = now;
  clock.playedMs += elapsed;
  clock.fallMs += elapsed;
  if (clock.playedMs >= GAME_MINUTES * 60000 || S.game.over) { endGame(); return; }
  while (clock.fallMs >= dropInterval(S.game.rows) && !S.game.over) {
    clock.fallMs -= dropInterval(S.game.rows);
    if (gameDown(S.game) > 0) play("right");
  }
  if (S.game.over) { endGame(); return; }
  const left = Math.max(0, GAME_MINUTES * 60000 - clock.playedMs);
  document.getElementById("game-time").textContent = mmss(left / 1000);
  document.getElementById("game-time-bar").style.width = 100 * left / (GAME_MINUTES * 60000) + "%";
  document.getElementById("game-rows").textContent = S.game.rows;
  document.getElementById("game-points").textContent = S.game.points;
  drawGame();
  requestAnimationFrame(gameFrame);
}

function render() {
  const title = BLOCKS.find(b => b.id === S.block).title;
  document.getElementById("title").textContent = document.title = S.lang === "en" ? title.en : title.de;
  document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang === S.lang));
  document.getElementById("snd").textContent = S.sound ? "🔊" : "🔇";
  document.getElementById("tmr").classList.toggle("off", !S.timerOn);
  app.innerHTML = S.view === "home" ? viewHome() : S.view === "summary" ? viewSummary() : S.view === "game" ? viewGame() : viewPractice();
  if (S.view === "practice" && !S.done) {
    const first = document.getElementById("f0");
    if (first) first.focus();
  }
}

// ---------- events ----------

document.addEventListener("click", e => {
  const el = e.target.closest("[data-lang],[data-act],[data-skill],[data-choice],[data-multi],[data-pick],[data-unpick],[data-tick],[data-speed],[data-block]");
  if (!el) return;
  const d = el.dataset;
  if (d.act === "partyclose") { closeParty(); return; }
  if (d.lang) { syncInputs(); S.lang = d.lang; storage.setItem("m4-lang", S.lang); render(); return; }
  if (d.act === "sound") {
    syncInputs();
    S.sound = !S.sound;
    storage.setItem("m4-sound", S.sound ? "on" : "off");
    render();
    play("hint");
    return;
  }
  if (d.act === "timer") {
    syncInputs();
    S.timerOn = !S.timerOn;
    storage.setItem("m4-timer", S.timerOn ? "on" : "off");
    render();
    return;
  }
  if (d.speed) { S.speed = d.speed; storage.setItem("m4-speed", S.speed); render(); return; }
  if (d.block) { S.block = d.block; storage.setItem("m4-block", S.block); render(); return; }
  if (d.skill) { startSkill(d.skill); return; }
  if (d.act === "game") {
    if (!S.mix || !earnsGame(S.mix) || S.mix.gamePlayed) return;
    S.mix.gamePlayed = true;
    S.game = newGame();
    S.gameClock = { playedMs: 0, fallMs: 0, last: null, ended: false };
    S.view = "game";
    render();
    window.scrollTo(0, 0);
    requestAnimationFrame(gameFrame);
    return;
  }
  if (d.act === "gleft" || d.act === "gturn" || d.act === "gright" || d.act === "gdrop") { gameAction(d.act); return; }
  if (d.act === "gameend") { endGame(); return; }
  if (d.act === "gameback") { S.view = "summary"; render(); return; }
  if (d.act === "mix") { startMix(); return; }
  if (d.act === "home") { S.view = "home"; S.mix = null; render(); return; }
  if (d.act === "resetall") { openResetDialog(); return; }
  if (d.act === "resetno") { document.getElementById("reset-dialog").close(); return; }
  if (d.act === "resetyes") {
    document.getElementById("reset-dialog").close();
    S.progress = {};
    save();
    render();
    app.querySelector('[data-act="resetall"]').focus();
    return;
  }
  if (d.act === "check") { doCheck(); return; }
  if (d.act === "next") { doNext(); return; }
  if (d.act === "hint") { doHint(); return; }
  if (S.done) return;
  S.msg = null;
  if (d.act === "clearorder") S.input = [];
  else if (d.choice !== undefined) S.input = d.choice;
  else if (d.multi !== undefined) { const i = Number(d.multi); S.input = S.input.includes(i) ? S.input.filter(x => x !== i) : [...S.input, i]; }
  else if (d.pick !== undefined) S.input = [...S.input, Number(d.pick)];
  else if (d.unpick !== undefined) S.input = S.input.filter((_, k) => k !== Number(d.unpick));
  else if (d.tick !== undefined) S.input = Number(d.tick);
  render();
});

document.addEventListener("keydown", e => {
  if (S.view === "game" && !S.gameClock.ended) {
    if (e.key === "ArrowLeft") { e.preventDefault(); gameAction("gleft"); }
    else if (e.key === "ArrowRight") { e.preventDefault(); gameAction("gright"); }
    else if (e.key === "ArrowUp") { e.preventDefault(); gameAction("gturn"); }
    else if (e.key === "ArrowDown") { e.preventDefault(); gameAction("gdown"); }
    else if (e.key === " ") { e.preventDefault(); if (!e.repeat) gameAction("gdrop"); }
    return;
  }
  if (party) {
    if (e.key === "Enter" || e.key === "Escape") { e.preventDefault(); closeParty(); }
    return;
  }
  if (e.key !== "Enter" || S.view !== "practice") return;
  e.preventDefault();
  if (S.done) doNext(); else doCheck();
});

render();
</script>
</body>
</html>
